name: tests

# Runs on the active development branch (v2-platform) and on pull requests.
# main is intentionally NOT a push trigger: it holds the historical V1 MVP and
# is never built from here.
on:
  push:
    branches: [v2-platform]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- engine
  engine:
    name: Engine + platform tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is the reference interpreter the published results were produced
        # on; 3.12 catches accidental use of newer-only syntax.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run the engine and platform test suite
        env:
          PILOT_ENV: test
          PILOT_PARTICIPANT_SALT: ci-fixed-salt-not-a-real-secret
        run: python -m pytest -q --durations=10

  # -------------------------------------------------------------- regression
  regression:
    name: Numerical regression (reference environment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify the validated numerical outputs have not moved
        env:
          PILOT_ENV: test
          PILOT_PARTICIPANT_SALT: ci-fixed-salt-not-a-real-secret
        run: |
          python -m pytest tests/test_regression_baseline.py \
                           tests/test_integrator_convergence.py -q

  # ------------------------------------------------------------- web backend
  backend:
    name: Web API tests (FastAPI, engine parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install engine + API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r web-platform/backend/requirements.txt
      - name: Run the API test suite (including bit-exact engine parity)
        working-directory: web-platform/backend
        env:
          PILOT_ENV: test
          PILOT_PARTICIPANT_SALT: ci-fixed-salt-not-a-real-secret
        run: python -m pytest -q

  # ------------------------------------------------------------ web frontend
  frontend:
    name: Web frontend (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-platform/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src --ext .ts,.tsx --max-warnings 0
      - name: Unit tests
        run: npx vitest run
      - name: Production build
        run: npm run build

  # ---------------------------------------------------------------- secrets
  secrets:
    name: No secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for committed secrets, databases and personal data
        run: |
          set -e
          fail=0

          # Paths that legitimately contain placeholder / example / local-dev
          # values (never real secrets): env examples anywhere, markdown docs,
          # both test suites, the CI workflows, and the local-dev compose file
          # (its postgres password is a throwaway inside the compose network).
          SAFE=(':!.env.example' ':!web-platform/.env.example'
                ':!*.md' ':!docs/*'
                ':!tests/*' ':!web-platform/backend/tests/*'
                ':!.github/*' ':!web-platform/docker-compose.yml')

          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git"; fail=1
          fi
          if ! test -f .env.example; then
            echo "::error::.env.example is missing"; fail=1
          fi
          if git ls-files | grep -E '\.(db|sqlite3?)$'; then
            echo "::error::a database file is tracked by git"; fail=1
          fi
          if git ls-files | grep -E 'node_modules/'; then
            echo "::error::node_modules is tracked by git"; fail=1
          fi
          # A populated (non-placeholder) admin password: a value that is not
          # CHANGE_ME and not a commented line.
          if git grep -nI -P '^[^#]*PILOT_ADMIN_PASSWORD=(?!CHANGE_ME)[^[:space:]]' \
               -- "${SAFE[@]}"; then
            echo "::error::an admin password appears in a tracked file"; fail=1
          fi
          if git grep -nI -E 'PILOT_PARTICIPANT_SALT=[0-9a-f]{32,}' \
               -- "${SAFE[@]}"; then
            echo "::error::a real participant salt appears in a tracked file"; fail=1
          fi
          if git grep -nI -E 'postgres(ql)?(\+[a-z]+)?://[^:/@[:space:]]+:[^@[:space:]]+@' \
               -- "${SAFE[@]}"; then
            echo "::error::a database URL with a password appears in a tracked file"; fail=1
          fi
          echo "secret scan complete (fail=$fail)"
          exit $fail
